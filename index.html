<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YSL Perfume WebGL Water Simulation</title>
    <!-- Tailwind CSS for UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050508;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        .glass-panel {
            background: rgba(15, 15, 25, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Main WebGL Viewport Container -->
    <div id="canvas-container"></div>

    <!-- UI Overlay -->
    <div class="absolute bottom-6 right-6 z-10 text-white pointer-events-none">
        <div class="glass-panel p-3.5 rounded-xl w-48 pointer-events-auto shadow-2xl transition-all duration-300 hover:border-amber-500/50 scale-95 origin-bottom-right">
            <div class="flex items-center space-x-1.5 mb-1">
                <span class="text-[9px] uppercase tracking-widest px-1.5 py-0.5 rounded-full bg-amber-500/20 text-amber-300 font-semibold border border-amber-500/30">Roman Holiday</span>
            </div>
            <h1 class="text-base font-serif font-light tracking-wider text-amber-100">Space Garden Lady</h1>
            <p class="text-[9px] text-gray-400 mt-0.5 uppercase tracking-widest font-mono">GPU WebGL Water</p>
            <p class="text-[10px] text-gray-300 mt-1.5 leading-snug">
                Drag bottle from lower-left or click water to trigger gentle ripples.
            </p>
            
            <!-- Controls Summary -->
            <div class="mt-2 space-y-1 text-[9px] text-gray-400 border-t border-white/10 pt-2">
                <div class="flex items-center justify-between">
                    <span><i class="fa-solid fa-hand-pointer mr-1 text-amber-400"></i>Drag Bottle:</span>
                    <span class="text-gray-200">Left Drag</span>
                </div>
                <div class="flex items-center justify-between">
                    <span><i class="fa-solid fa-water mr-1 text-amber-400"></i>Ripple Pool:</span>
                    <span class="text-gray-200">Left Click</span>
                </div>
                <div class="flex items-center justify-between">
                    <span><i class="fa-solid fa-camera mr-1 text-amber-400"></i>Orbit View:</span>
                    <span class="text-gray-200">Right Drag</span>
                </div>
                <div class="flex items-center justify-between">
                    <span><i class="fa-solid fa-magnifying-glass mr-1 text-amber-400"></i>Zoom View:</span>
                    <span class="text-gray-200">Scroll Wheel</span>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="mt-2.5 pt-2 border-t border-white/10 flex flex-col gap-1.5">
                <button id="btn-reset-view" class="w-full py-1 bg-amber-600/80 hover:bg-amber-500 text-white rounded text-[9px] font-semibold uppercase tracking-wider transition-all flex items-center justify-center gap-1">
                    <i class="fa-solid fa-video text-[8px]"></i> Reset View
                </button>
                <button id="btn-reset" class="w-full py-1 bg-white/10 hover:bg-white/20 text-amber-200 rounded text-[9px] font-semibold uppercase tracking-wider transition-all flex items-center justify-center gap-1">
                    <i class="fa-solid fa-rotate-right text-[8px]"></i> Reset Bottle
                </button>
                <button id="btn-splash" class="w-full py-1 bg-white/10 hover:bg-white/20 text-amber-200 rounded text-[9px] font-semibold uppercase tracking-wider transition-all flex items-center justify-center gap-1">
                    <i class="fa-solid fa-water text-[8px]"></i> Big Splash
                </button>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            let container, scene, camera, renderer, controls;
            let waterMesh, waterMaterial, waterGeometry;
            let perfumeGroup, bottleMesh;
            let raycaster, mouse, dragPlane, isDragging = false;
            
            // Bottle initialized in lower-left corner
            let targetBottlePos = new THREE.Vector3(-9, 0, 9);
            let prevBottlePos = new THREE.Vector3(-9, 0, 9);

            const defaultCamPos = new THREE.Vector3(0, 20, 26);
            const defaultCamTarget = new THREE.Vector3(0, 1, 0);

            const GRID_SIZE = 80;
            const GRID_BOUNDS = 30;
            let heightBuffer1 = new Float32Array(GRID_SIZE * GRID_SIZE);
            let heightBuffer2 = new Float32Array(GRID_SIZE * GRID_SIZE);
            
            let normalCanvas, normalCtx, normalTexture;

            init();
            animate();

            function init() {
                container = document.getElementById('canvas-container');

                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x04060c);
                scene.fog = new THREE.FogExp2(0x04060c, 0.015);

                camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.copy(defaultCamPos);

                renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                renderer.toneMapping = THREE.ACESFilmicToneMapping;
                container.appendChild(renderer.domElement);

                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
                controls.maxPolarAngle = Math.PI / 2 - 0.02;
                controls.minDistance = 8;
                controls.maxDistance = 60;
                controls.target.copy(defaultCamTarget);
                
                controls.mouseButtons = {
                    LEFT: THREE.MOUSE.NONE,
                    MIDDLE: THREE.MOUSE.DOLLY,
                    RIGHT: THREE.MOUSE.ROTATE
                };

                const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
                scene.add(ambientLight);

                const sunLight = new THREE.DirectionalLight(0xffffff, 2.5);
                sunLight.position.set(15, 30, 15);
                sunLight.castShadow = true;
                sunLight.shadow.mapSize.width = 2048;
                sunLight.shadow.mapSize.height = 2048;
                scene.add(sunLight);

                createEnvironmentMap();

                normalCanvas = document.createElement('canvas');
                normalCanvas.width = GRID_SIZE;
                normalCanvas.height = GRID_SIZE;
                normalCtx = normalCanvas.getContext('2d');
                normalTexture = new THREE.CanvasTexture(normalCanvas);
                normalTexture.wrapS = THREE.RepeatWrapping;
                normalTexture.wrapT = THREE.RepeatWrapping;

                createPoolAndWater();
                createYSLPerfumeBottle();

                raycaster = new THREE.Raycaster();
                mouse = new THREE.Vector2();
                const planeGeo = new THREE.PlaneGeometry(200, 200);
                planeGeo.rotateX(-Math.PI / 2);
                dragPlane = new THREE.Mesh(planeGeo, new THREE.MeshBasicMaterial({ visible: false }));
                scene.add(dragPlane);

                window.addEventListener('resize', onWindowResize);
                renderer.domElement.addEventListener('pointerdown', onPointerDown);
                renderer.domElement.addEventListener('pointermove', onPointerMove);
                window.addEventListener('pointerup', () => { isDragging = false; controls.enabled = true; });

                document.getElementById('btn-reset-view').addEventListener('click', () => {
                    camera.position.copy(defaultCamPos);
                    controls.target.copy(defaultCamTarget);
                    controls.update();
                });
                document.getElementById('btn-reset').addEventListener('click', () => {
                    targetBottlePos.set(-9, 0, 9);
                    addSplash(-9, 9, 2.0 * (1/3), 4);
                });
                document.getElementById('btn-splash').addEventListener('click', () => {
                    for (let i = 0; i < 6; i++) {
                        setTimeout(() => {
                            const rx = (Math.random() - 0.5) * 18;
                            const rz = (Math.random() - 0.5) * 18;
                            addSplash(rx, rz, (2.0 + Math.random() * 2.0) * (1/3), 2);
                        }, i * 90);
                    }
                });

                addSplash(-9, 9, 2.0 * (1/3), 5);
            }

            function addSplash(worldX, worldZ, strength = 1.5, radius = 3) {
                const gx = Math.floor(((worldX + GRID_BOUNDS / 2) / GRID_BOUNDS) * GRID_SIZE);
                const gz = Math.floor(((worldZ + GRID_BOUNDS / 2) / GRID_BOUNDS) * GRID_SIZE);

                for (let dx = -radius; dx <= radius; dx++) {
                    for (let dz = -radius; dz <= radius; dz++) {
                        const x = gx + dx;
                        const z = gz + dz;
                        if (x > 1 && x < GRID_SIZE - 2 && z > 1 && z < GRID_SIZE - 2) {
                            const dist = Math.sqrt(dx * dx + dz * dz);
                            if (dist <= radius) {
                                const factor = (1 - dist / radius);
                                const idx = z * GRID_SIZE + x;
                                heightBuffer1[idx] -= strength * factor;
                            }
                        }
                    }
                }
            }

            function updateWaveSimulation() {
                const damping = 0.965;
                const imgData = normalCtx.createImageData(GRID_SIZE, GRID_SIZE);
                const data = imgData.data;

                for (let z = 1; z < GRID_SIZE - 1; z++) {
                    for (let x = 1; x < GRID_SIZE - 1; x++) {
                        const idx = z * GRID_SIZE + x;
                        const left  = heightBuffer1[idx - 1];
                        const right = heightBuffer1[idx + 1];
                        const up    = heightBuffer1[idx - GRID_SIZE];
                        const down  = heightBuffer1[idx + GRID_SIZE];

                        heightBuffer2[idx] = ((left + right + up + down) / 2.0 - heightBuffer2[idx]) * damping;
                    }
                }

                const temp = heightBuffer1;
                heightBuffer1 = heightBuffer2;
                heightBuffer2 = temp;

                const posAttr = waterGeometry.attributes.position;
                
                for (let z = 0; z < GRID_SIZE; z++) {
                    for (let x = 0; x < GRID_SIZE; x++) {
                        const idx = z * GRID_SIZE + x;
                        const h = heightBuffer1[idx];

                        posAttr.setY(idx, h);

                        const hL = heightBuffer1[Math.max(0, idx - 1)];
                        const hR = heightBuffer1[Math.min(GRID_SIZE * GRID_SIZE - 1, idx + 1)];
                        const hU = heightBuffer1[Math.max(0, idx - GRID_SIZE)];
                        const hD = heightBuffer1[Math.min(GRID_SIZE * GRID_SIZE - 1, idx + GRID_SIZE)];

                        const nx = (hL - hR) * 2.0;
                        const nz = (hU - hD) * 2.0;
                        const ny = 1.0;

                        const len = Math.sqrt(nx * nx + ny * ny + nz * nz);
                        const pxIdx = (idx) * 4;
                        data[pxIdx]     = Math.floor(((nx / len) * 0.5 + 0.5) * 255);
                        data[pxIdx + 1] = Math.floor(((nz / len) * 0.5 + 0.5) * 255);
                        data[pxIdx + 2] = Math.floor(((ny / len) * 0.5 + 0.5) * 255);
                        data[pxIdx + 3] = 255;
                    }
                }

                posAttr.needsUpdate = true;
                waterGeometry.computeVertexNormals();

                normalCtx.putImageData(imgData, 0, 0);
                normalTexture.needsUpdate = true;
            }

            function createPoolAndWater() {
                const tileSize = 512;
                const tileCanvas = document.createElement('canvas');
                tileCanvas.width = tileSize;
                tileCanvas.height = tileSize;
                const ctx = tileCanvas.getContext('2d');
                const tiles = 8;
                const sz = tileSize / tiles;

                for (let r = 0; r < tiles; r++) {
                    for (let c = 0; c < tiles; c++) {
                        const isEven = (r + c) % 2 === 0;
                        ctx.fillStyle = isEven ? '#0284c7' : '#ffffff';
                        ctx.fillRect(c * sz, r * sz, sz, sz);
                        ctx.strokeStyle = '#0369a1';
                        ctx.lineWidth = 6;
                        ctx.strokeRect(c * sz, r * sz, sz, sz);
                    }
                }
                
                const poolFloorTexture = new THREE.CanvasTexture(tileCanvas);
                poolFloorTexture.wrapS = THREE.RepeatWrapping;
                poolFloorTexture.wrapT = THREE.RepeatWrapping;
                poolFloorTexture.repeat.set(6, 6);

                const poolFloorMat = new THREE.MeshStandardMaterial({
                    map: poolFloorTexture,
                    roughness: 0.2,
                    metalness: 0.1
                });
                const poolFloor = new THREE.Mesh(new THREE.PlaneGeometry(GRID_BOUNDS, GRID_BOUNDS), poolFloorMat);
                poolFloor.rotation.x = -Math.PI / 2;
                poolFloor.position.y = -6;
                poolFloor.receiveShadow = true;
                scene.add(poolFloor);

                const wallHeight = 7;
                const wallLongTexture = new THREE.CanvasTexture(tileCanvas);
                wallLongTexture.wrapS = THREE.RepeatWrapping;
                wallLongTexture.wrapT = THREE.RepeatWrapping;
                wallLongTexture.repeat.set(6, 6 * (wallHeight / GRID_BOUNDS));

                const wallLongMat = new THREE.MeshStandardMaterial({ map: wallLongTexture, roughness: 0.3 });

                const createWall = (x, z, w, d, rotY = 0) => {
                    const wall = new THREE.Mesh(new THREE.BoxGeometry(w, wallHeight, d), wallLongMat);
                    wall.position.set(x, -6 + wallHeight / 2, z);
                    wall.rotation.y = rotY;
                    scene.add(wall);
                };
                createWall(0, -GRID_BOUNDS/2 - 0.5, GRID_BOUNDS + 1, 1);
                createWall(0, GRID_BOUNDS/2 + 0.5, GRID_BOUNDS + 1, 1);
                createWall(-GRID_BOUNDS/2 - 0.5, 0, GRID_BOUNDS, 1, Math.PI / 2);
                createWall(GRID_BOUNDS/2 + 0.5, 0, GRID_BOUNDS, 1, Math.PI / 2);

                waterGeometry = new THREE.PlaneGeometry(GRID_BOUNDS, GRID_BOUNDS, GRID_SIZE - 1, GRID_SIZE - 1);
                waterGeometry.rotateX(-Math.PI / 2);

                // Initial procedural fallback canvas texture so screen is never black
                const fallbackCanvas = document.createElement('canvas');
                fallbackCanvas.width = 1024;
                fallbackCanvas.height = 1024;
                const fCtx = fallbackCanvas.getContext('2d');
                const grad = fCtx.createLinearGradient(0, 0, 1024, 1024);
                grad.addColorStop(0, '#0284c7');
                grad.addColorStop(0.5, '#38bdf8');
                grad.addColorStop(1, '#0369a1');
                fCtx.fillStyle = grad;
                fCtx.fillRect(0, 0, 1024, 1024);
                fCtx.fillStyle = '#ffffff';
                fCtx.font = 'bold 90px serif';
                fCtx.textAlign = 'center';
                fCtx.fillText('Space Garden Lady', 512, 480);

                const fallbackTexture = new THREE.CanvasTexture(fallbackCanvas);
                fallbackTexture.wrapS = THREE.RepeatWrapping;
                fallbackTexture.wrapT = THREE.RepeatWrapping;

                waterMaterial = new THREE.MeshStandardMaterial({
                    map: fallbackTexture,
                    emissive: 0x333333,
                    emissiveMap: fallbackTexture,
                    emissiveIntensity: 0.4,
                    roughness: 0.2,
                    metalness: 0.05,
                    normalMap: normalTexture,
                    normalScale: new THREE.Vector2(3.0, 3.0),
                    side: THREE.DoubleSide
                });

                waterMesh = new THREE.Mesh(waterGeometry, waterMaterial);
                waterMesh.receiveShadow = true;
                scene.add(waterMesh);

                // Load image directly from Google Drive link using standard Image element with CORS enabled
                const img = new Image();
                img.crossOrigin = 'anonymous';
                //img.src = 'https://lh3.googleusercontent.com/d/1WgQJBiHYfBAdycwA8Tqfa---lFVnkFrE';
                //img.src = 'https://drive.google.com/file/d/1wZRXxWU87HWDhuXE4Da40Av0FYVYV1Ww/view?usp=drive_link';
                img.src = 'https://lh3.googleusercontent.com/d/1wZRXxWU87HWDhuXE4Da40Av0FYVYV1Ww';
                img.onload = function() {
                    const driveTexture = new THREE.Texture(img);
                    driveTexture.wrapS = THREE.RepeatWrapping;
                    driveTexture.wrapT = THREE.RepeatWrapping;
                    driveTexture.needsUpdate = true;
                    waterMaterial.map = driveTexture;
                    waterMaterial.emissiveMap = driveTexture;
                    waterMaterial.needsUpdate = true;
                };
                img.onerror = function() {
                    console.warn('Google Drive image load encountered network issue, keeping canvas fallback.');
                };
            }

            function createYSLPerfumeBottle() {
                perfumeGroup = new THREE.Group();
                perfumeGroup.position.set(-9, 0, 9);

                const glassMat = new THREE.MeshPhysicalMaterial({
                    color: 0x111115,
                    transmission: 0.92,
                    transparent: true,
                    roughness: 0.08,
                    metalness: 0.1,
                    ior: 1.52,
                    thickness: 1.2
                });
                bottleMesh = new THREE.Mesh(new THREE.BoxGeometry(3.6, 5.2, 2.0), glassMat);
                bottleMesh.position.y = 2.6;
                bottleMesh.castShadow = true;
                perfumeGroup.add(bottleMesh);

                const liquidMat = new THREE.MeshStandardMaterial({
                    color: 0xd97706,
                    roughness: 0.2,
                    metalness: 0.3,
                    emissive: 0x451a03,
                    emissiveIntensity: 0.5
                });
                const liquidMesh = new THREE.Mesh(new THREE.BoxGeometry(3.1, 4.0, 1.6), liquidMat);
                liquidMesh.position.y = 2.2;
                perfumeGroup.add(liquidMesh);

                const goldMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, metalness: 0.95, roughness: 0.15 });
                const capMesh = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.8, 1.8), goldMat);
                capMesh.position.y = 6.1;
                capMesh.castShadow = true;
                perfumeGroup.add(capMesh);

                const logoGroup = new THREE.Group();
                const logoMat = new THREE.MeshStandardMaterial({ color: 0xfbbf24, metalness: 0.98, roughness: 0.1 });

                const yStem = new THREE.Mesh(new THREE.BoxGeometry(0.25, 1.4, 0.1), logoMat);
                yStem.position.set(-0.4, 0, 0);
                logoGroup.add(yStem);

                const sMid = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.25, 0.1), logoMat);
                sMid.position.set(0, 0.1, 0);
                logoGroup.add(sMid);

                const lVert = new THREE.Mesh(new THREE.BoxGeometry(0.25, 1.8, 0.1), logoMat);
                lVert.position.set(0.6, 0.1, 0);
                logoGroup.add(lVert);

                logoGroup.position.set(-0.1, 2.6, 1.05);
                perfumeGroup.add(logoGroup);

                scene.add(perfumeGroup);
            }

            function createEnvironmentMap() {
                const envCanvas = document.createElement('canvas');
                envCanvas.width = 512;
                envCanvas.height = 256;
                const ctx = envCanvas.getContext('2d');
                const grad = ctx.createLinearGradient(0, 0, 0, 256);
                grad.addColorStop(0, '#1e293b');
                grad.addColorStop(0.5, '#0f172a');
                grad.addColorStop(1, '#020617');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 512, 256);

                const texture = new THREE.CanvasTexture(envCanvas);
                texture.mapping = THREE.EquirectangularReflectionMapping;
                scene.environment = texture;
            }

            function onPointerDown(e) {
                if (e.button !== 0) return;

                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const bottleIntersects = raycaster.intersectObject(bottleMesh, true);

                if (bottleIntersects.length > 0) {
                    isDragging = true;
                    controls.enabled = false;
                } else {
                    const waterIntersects = raycaster.intersectObject(waterMesh);
                    if (waterIntersects.length > 0) {
                        const pt = waterIntersects[0].point;
                        addSplash(pt.x, pt.z, 1.5 * (1/3), 4);
                    }
                }
            }

            function onPointerMove(e) {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

                if (isDragging) {
                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObject(dragPlane);
                    if (intersects.length > 0) {
                        const pt = intersects[0].point;
                        targetBottlePos.x = THREE.MathUtils.clamp(pt.x, -12, 12);
                        targetBottlePos.z = THREE.MathUtils.clamp(pt.z, -12, 12);
                    }
                }
            }

            function onWindowResize() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }

            function animate() {
                requestAnimationFrame(animate);

                perfumeGroup.position.x += (targetBottlePos.x - perfumeGroup.position.x) * 0.15;
                perfumeGroup.position.z += (targetBottlePos.z - perfumeGroup.position.z) * 0.15;

                const speed = perfumeGroup.position.distanceTo(prevBottlePos);

                const time = Date.now() * 0.003;
                perfumeGroup.position.y = Math.sin(time) * 0.15 - 0.25;

                if (speed > 0.02) {
                    addSplash(perfumeGroup.position.x, perfumeGroup.position.z, Math.min(speed * 2.5, 1.5) * (1/3), 4);
                } else {
                    addSplash(perfumeGroup.position.x, perfumeGroup.position.z, 2.0 * (1/3), 3.0);
                }

                prevBottlePos.copy(perfumeGroup.position);

                updateWaveSimulation();

                controls.update();
                renderer.render(scene, camera);
            }
        };
    </script>
</body>
</html>
